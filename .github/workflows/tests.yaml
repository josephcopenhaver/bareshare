name: tests
permissions:
  contents: read
  pull-requests: read
on:
  push:
  schedule:
    - cron: "20 18 * * 6" # INIT_CRON_EXPRESSION: echo "$(((RANDOM%60))) $(((RANDOM%24)))"' * * '"$( if [[ $(((RANDOM%2))) -eq 0 ]]; then echo 0; else echo 6; fi )"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash on every OS (Git Bash on windows runners): identical argument
        # tokenization everywhere; pwsh splits tokens like
        # -coverprofile=coverage.out at the period.
        shell: bash
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        go:
          - ver: "1.27"
            name: "1.27"
          - ver: ">=1.27"
            name: "gte-1.27"
    name: Go ${{ matrix.go.ver }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go.ver }}
      - name: verify golang files are consistently formatted and generated
        if: matrix.os == 'ubuntu-latest'
        run: |
          [ `git status --porcelain=1 | wc -l` -eq 0 ] || (>&2 echo "failed to establish that files were unchanged before running go-generate check" ; exit 1)
          # go generate ./...
          # [ `git status --porcelain=1 | wc -l` -eq 0 ] || (>&2 echo "files changed after running go-generate" ; exit 1)
      - name: test without race
        run: |
          go test ./...
      - name: test with race
        run: |
          go test -coverprofile=coverage.out -race ./...
          go tool cover -html=coverage.out -o coverage.html
      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-${{ matrix.go.name }}-${{ matrix.os }}
          path: coverage.html
